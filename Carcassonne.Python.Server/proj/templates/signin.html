{% extends "layout.html" %}

{% block title %}{{ _('Sign In') }}{% endblock %}

{% block content %}
  <h1>{{ _('Sign In') }}</h1>
  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('signin') }}">
    <label>{{ _('Username:') }} <input type="text" name="username" /></label><br/>
    <label>{{ _('Password:') }} <input type="password" name="password" /></label><br/>
    <button type="submit">{{ _('Sign In') }}</button>
  </form>
{% endblock %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Carcassonne UI Demo</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script defer src="/static/app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>
    <main class="container-fluid">
        <h1>Carcassonne - UI Demo</h1>

        <form class="row g-3" name="connectForm">
            <div class="col-auto">
                <label for="gameId" class="visually-hidden">Game</label>
                <input type="text" class="form-control-plaintext" name="gameId" value="">
            </div>
            <div class="col-auto">
                <button type="submit" name="btnConnect" class="btn btn-primary mb-3">Connect</button>
            </div>
        </div>
        <div class="p-3 mb-2 bg-dark text-white rounded">
            <pre id="log" class="text-wrap"></pre>
        </div>
    </main>
</body>

</html>

<div data-ng-if="board.nextTile" class="tile">
    <img src="img/tiles/{{board.nextTile.img}}" alt="tile" />
</div>
<div class="board" data-ng-board data-ng-size="board.size">
    <div data-ng-move="move" data-ng-repeat="move in board.moves" data-ng-offset="board.offset"></div>
    <div data-ng-available-position="availablePosition" data-ng-repeat="availablePosition in board.availablePositions" data-ng-offset="board.offset"></div>
</div>
